<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Generator</title>
<!-- build:css -->
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<aside>
  <header>
    <div><h1>Poster</h1>
      <select id="size" aria-label="Format">
        <optgroup label="DIN"><option value="a5">A5 · 14,8 × 21 cm</option><option value="a4">A4 · 21 × 29,7 cm</option><option value="a3">A3 · 29,7 × 42 cm</option><option value="a2">A2 · 42 × 59,4 cm</option><option value="a1">A1 · 59,4 × 84,1 cm</option></optgroup>
        <optgroup label="Poster"><option value="30x40">30 × 40 cm</option><option value="40x50">40 × 50 cm</option><option value="50x70" selected>50 × 70 cm</option><option value="60x90">60 × 90 cm</option><option value="70x100">70 × 100 cm</option></optgroup>
      </select></div>
  </header>
  <div class="toolbar" role="toolbar" aria-label="Projekt">
    <button type="button" id="newPoster" class="button">Neu</button>
    <label class="button">Öffnen…<input type="file" id="openProject" accept=".json,application/json" class="visually-hidden"></label>
    <button type="button" id="saveProject" class="button">Sichern…</button>
  </div>
  <form id="form" autocomplete="off">
    <h2>Spiel</h2>
    <div class="group">
      <div class="row"><label for="game">Suchen</label><input id="game" type="search" placeholder="z. B. Hollow Knight" aria-describedby="gameStatus" aria-controls="games"></div>
      <div class="results" id="games" role="group" aria-label="Suchergebnisse"></div>
    </div>
    <p class="footnote" id="gameStatus" aria-live="polite"></p>

    <h2>Bild</h2>
    <div class="group">
      <label class="file"><input type="file" id="image" accept="image/*" class="visually-hidden"><span class="button">Bild auswählen…</span><span id="imageName">oder in die Vorschau ziehen</span></label>
      <div class="row stack"><span id="searchLabel">Suchen in</span><div class="links" role="group" aria-labelledby="searchLabel">
        <a class="button" data-search="presskit" href="#" target="_blank" rel="noopener" title="Offizielles Artwork der Studios, meist höchste Qualität">Presskit ↗</a>
        <a class="button" data-search="alphacoders" href="#" target="_blank" rel="noopener" title="Viele Spiele-Wallpaper, auf der Seite nach 4K+ filtern">Alpha Coders ↗</a>
        <a class="button" data-search="google" href="#" target="_blank" rel="noopener" title="Google Bilder, nur große Bilder">Google ↗</a>
        <a class="button" data-search="wallhaven" href="#" target="_blank" rel="noopener" title="Fan-Art und Wallpaper ab 2400 px">Wallhaven ↗</a>
      </div></div>
      <div class="upscale"><button type="button" id="upscale" class="button" disabled>Mit KI hochskalieren</button><span id="upscaleInfo" aria-live="polite"></span>
        <progress id="upscaleProgress" hidden aria-label="Fortschritt Hochskalieren"></progress></div>
      <div class="row"><label for="zoom">Zoom</label><input type="range" id="zoom" min="0.2" max="4" step="0.01" value="1"></div>
      <input type="hidden" id="cropX" value="0.5"><input type="hidden" id="cropY" value="0.5"><input type="hidden" id="website">
    </div>
    <p class="footnote">Ausschnitt: Bild in der Vorschau ziehen, zoomen mit Mausrad oder Regler.</p>
    <p class="footnote" id="dpi" aria-live="polite"></p>

    <h2>Titel</h2>
    <div class="group">
      <div class="row"><label for="title">Titel</label><input id="title" placeholder="z. B. Star Wars:"></div>
      <div class="row"><label for="subtitle">Untertitel</label><textarea id="subtitle" rows="2" placeholder="optional, mehrzeilig möglich"></textarea></div>
    </div>
    <p class="footnote warn" id="titleWarn" aria-live="polite"></p>

    <h2>Details</h2>
    <div class="group">
      <div class="row"><label for="company">Company</label><input id="company" placeholder="z. B. Team Cherry"></div>
      <div class="row"><label for="genres">Genres</label><textarea id="genres" rows="4" aria-describedby="genresHint" placeholder="Action&#10;Adventure"></textarea></div>
      <label class="file"><input type="file" id="logo" accept="image/*" class="visually-hidden"><span class="button">Logo auswählen…</span><span id="logoName">optional, PNG mit Transparenz</span></label>
    </div>
    <p class="footnote" id="genresHint">Ein Genre pro Zeile.</p>

    <h2>Beschreibung</h2>
    <div class="group">
      <div class="row"><label for="desc">Text</label><textarea id="desc" rows="5" placeholder="Kurzbeschreibung, etwa 2–4 Zeilen auf dem Poster"></textarea></div>
      <div class="row"><label for="year">Jahr</label><input id="year" placeholder="2017" inputmode="numeric"></div>
      <div class="row"><label for="day">Datum</label><input id="day" placeholder="Feb 24"></div>
    </div>

    <h2 id="colorsLabel">Farben</h2>
    <div class="group swatches" role="group" aria-labelledby="colorsLabel">
      <input type="color" id="color1" aria-label="Farbe 1" value="#444444">
      <input type="color" id="color2" aria-label="Farbe 2" value="#666666">
      <input type="color" id="color3" aria-label="Farbe 3" value="#888888">
      <input type="color" id="color4" aria-label="Farbe 4" value="#aaaaaa">
      <input type="color" id="color5" aria-label="Farbe 5" value="#cccccc">
      <button type="button" id="auto">Aus Bild</button>
    </div>
  </form>
  <footer>
    <div class="options">
      <label><input type="checkbox" id="bleed" role="switch" aria-describedby="exportInfo"> 3 mm Beschnitt</label>
      <select id="format" aria-label="Dateiformat"><option value="png">PNG</option><option value="jpeg">JPG</option></select>
    </div>
    <button type="button" id="export" class="primary">Als PNG exportieren</button>
    <p class="secondary"><span id="exportInfo">5906 × 8268 px</span> · Daten: <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, <a href="https://www.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a></p>
  </footer>
</aside>
<main id="main"><canvas id="preview" role="img" tabindex="0" aria-label="Postervorschau. Pfeiltasten verschieben den Bildausschnitt."></canvas></main>

<!-- build:vendor -->
<!-- build:js -->
</body>
</html>
